format = 2

[effect]
id = "alien.fade-grain"
name = "Grain Dissolve"
kind = "transition"
category = "ALIEN"
order = 14
description = "The next shot appears speck by speck through a field of noise, like dust settling."

[[param]]
key = "size"
label = "Grain Size"
min = 1
max = 40
default = 6
step = 1
unit = "px"

[[param]]
key = "soft"
label = "Softness"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
