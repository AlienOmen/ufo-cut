format = 2

[effect]
id = "alien.fx-rgb-split"
name = "RGB Split"
version = 1
kind = "effect"
category = "ALIEN FX"
shelves = ["ALIEN"]
order = 102
intensity = "amount"
description = "The three colour channels pulled apart along an angle, with an optional nervous jitter. A staple glitch look."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 80
default = 14
step = 0.5
unit = "px"
animate = true

[[param]]
key = "angle"
label = "Angle"
min = 0
max = 360
default = 0
step = 1
unit = "deg"
animate = true

[[param]]
key = "jitter"
label = "Jitter"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"
