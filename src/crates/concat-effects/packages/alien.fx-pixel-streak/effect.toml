format = 2

[effect]
id = "alien.fx-pixel-streak"
name = "Pixel Streak"
version = 1
kind = "effect"
category = "ALIEN FX"
shelves = ["ALIEN"]
order = 104
intensity = "threshold"
description = "Bright parts of the picture are dragged into long horizontal streaks, in the spirit of a pixel-sort glitch."

[[param]]
key = "threshold"
label = "Threshold"
min = 0
max = 100
default = 45
step = 1
unit = "%"
animate = true

[[param]]
key = "length"
label = "Length"
min = 0
max = 100
default = 40
step = 1
unit = "%"
animate = true

[[param]]
key = "jitter"
label = "Jitter"
min = 0
max = 100
default = 50
step = 1
unit = "%"
animate = true

[[param]]
key = "direction"
label = "Vertical"
min = 0
max = 1
default = 0
step = 1
animate = true
type = "bool"

[wgsl]
entry = "effect.wgsl"
