format = 2

[effect]
id = "alien.fx-grain"
name = "Film Grain Pro"
version = 1
kind = "effect"
category = "ALIEN FX"
shelves = ["ALIEN"]
order = 107
intensity = "amount"
description = "Animated film grain with a size control, colour grain and a response that favours the midtones."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 30
step = 1
unit = "%"
animate = true

[[param]]
key = "size"
label = "Size"
min = 1
max = 6
default = 1.6
step = 0.1
unit = "px"
animate = true

[[param]]
key = "colour"
label = "Colour Grain"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[[param]]
key = "shadows"
label = "Protect Shadows"
min = 0
max = 100
default = 40
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"
