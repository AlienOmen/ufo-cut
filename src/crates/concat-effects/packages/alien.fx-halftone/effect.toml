format = 2

[effect]
id = "alien.fx-halftone"
name = "Halftone Dots"
version = 1
kind = "effect"
category = "ALIEN FX"
shelves = ["ALIEN"]
order = 114
intensity = "size"
description = "The picture rebuilt from a grid of rotated dots, in colour or acid on black or paper."

[[param]]
key = "size"
label = "Dot Size"
min = 4
max = 40
default = 10
step = 1
unit = "px"
animate = true

[[param]]
key = "angle"
label = "Angle"
min = 0
max = 90
default = 45
step = 1
unit = "deg"
animate = true

[[param]]
key = "colour"
label = "Colour"
min = 0
max = 100
default = 100
step = 1
unit = "%"
animate = true

[[param]]
key = "paper"
label = "Paper"
min = 0
max = 1
default = 0
step = 1
animate = true
type = "bool"

[[param]]
key = "soft"
label = "Softness"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"
